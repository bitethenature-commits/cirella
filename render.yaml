# Render (render.com): crea la web y su base de datos de una vez.
# En Render: New → Blueprint → elige este repositorio. Te pedirá los valores marcados con
# «sync: false» (tus datos y las claves de R2 y Resend); los demás ya van puestos.
# Guía paso a paso: docs/render.md

services:
  - type: web
    name: mi-web
    runtime: node
    region: frankfurt
    # «free» para probar (se duerme tras 15 min sin visitas y tarda en despertar).
    # Para usarla de verdad: 0.5c-512mb (siempre despierta).
    plan: free
    buildCommand: npm ci && npm run build
    # Comprueba la configuración, aplica los cambios de la base de datos, crea tu cuenta la primera
    # vez (OWNER_EMAIL) y arranca la web.
    startCommand: npm run deploy && npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      # APP_URL vacía = la dirección de Render (https://mi-web-xxxx.onrender.com). Cuando tengas
      # dominio, añade APP_URL=https://tudominio.com.
      - key: SITE_MODE
        value: personal
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: PAYMENT_PROVIDER
        value: none
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mi-web-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: mi-web-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Render pone Cloudflare delante de todas sus webs: esta cabecera trae la IP de cada visita.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip

databases:
  - name: mi-web-db
    region: frankfurt
    # «free» caduca a los 30 días de crearla: antes, cámbiala a 0.1c-256mb (de pago).
    plan: free
    postgresMajorVersion: "16"
